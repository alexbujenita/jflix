services:

  db:
    image: postgres:18.3
    container_name: postgres_db
    # set shared memory limit when using docker compose
    shm_size: 512mb
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: t00r
